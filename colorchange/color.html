<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>color changing</title>
</head>
<style>
    .btn{
        border-radius: 20px;
        padding: 10px;
    }
</style>
<body>
    <h1 id="content">Hello, world!</h1>
    <p>Click buttons to change colour</p>
    <button onclick="cred()" style="background-color: red;" class="btn" >Red</button>
    <button onclick="cyellow()" style="background-color: yellow;" class="btn" >yellow</button>
    <button onclick="cgreen()" style="background-color: green;" class="btn" >green</button>
    <button onclick="corange()" style="background-color: orange;" class="btn" >orange</button>
    <button onclick="cblue()" style="background-color: blue" class="btn" >blue</button>
</body>
<script src="color.js"></script>
</html>
