<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div class="flex flex-col justify-center items-center gap-10 p-20 border hover:shadow-lg">
        <h1 id="num" class="text-4xl border p-5 rounded-lg">0</h1>
        <div class="flex flex-row gap-5">
            <button id="btnadd" class="p-3 bg-green-400 rounded-full">+1</button>
            <button id="btnsub" class="p-3 bg-red-600 rounded-full">-1</button>
            <button id="btnreset" class="p-3 bg-black text-white rounded-full">Reset as 0</button>
        </div>
    </div>
</body>
<script src="number.js"></script>
</html>
